# Dependency-vulnerability gates: a PR dependency review (blocks pulling in a
# known-vulnerable or badly-licensed dep) plus a lockfile audit on push/PR and
# weekly (so a newly-disclosed CVE in an already-pinned dep still surfaces).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Only meaningful on a PR (it diffs the PR's dependency changes).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # No `bun install` runs in this job (`bun audit` reads the committed
      # lockfiles directly), so there's deliberately no ~/.bun/install/cache step
      # here — it would cache a directory nothing populates or consumes.
      #
      # Gate at MODERATE, with every accepted advisory named individually via
      # --ignore. The previous blanket --audit-level=high swallowed the entire
      # moderate tier to tolerate exactly two known findings, which also meant a
      # NEW moderate advisory in a runtime dependency (express, ws, the MCP SDK)
      # would never have failed this job. Naming them instead makes each one an
      # explicit decision with an exit condition; anything not listed below is a
      # build failure at moderate or above.
      #
      # GHSA-q8mj-m7cp-5q26 — qs DoS in qs@6.15.1, nested under
      #   @stryker-mutator/core -> typed-rest-client, which hard-pins "qs" to an
      #   EXACT "6.15.1" (every other consumer in the tree already resolves to
      #   the patched 6.15.3). An `overrides` entry cannot move it either: the
      #   pin is exact, so only an upstream typed-rest-client release that
      #   widens it will. devDependency only (bun run test:mutate) and excluded
      #   from the production image by the Dockerfile's `bun install
      #   --production` deps stage, so there is no production exposure.
      #   DROP THIS IGNORE once typed-rest-client widens its qs pin.
      # GHSA-frvp-7c67-39w9 — path traversal in hono's `serve-static` on Windows
      #   via an encoded backslash, in @hono/node-server pulled in transitively
      #   by @modelcontextprotocol/sdk. The gateway is an Express app and never
      #   mounts hono's `serve-static` — the only static mount is
      #   `express.static` in src/index.ts (the /admin SPA) — so the vulnerable
      #   code path is unreachable here. Fixed upstream in >=2.0.5.
      #   DROP THIS IGNORE once the MCP SDK widens its `^1.19.9` range.
      - name: Audit root dependencies
        run: >-
          bun audit --audit-level=moderate
          --ignore=GHSA-q8mj-m7cp-5q26
          --ignore=GHSA-frvp-7c67-39w9
      # No ignores here: admin-ui audits clean at moderate. Keep it that way —
      # reach for an `overrides` entry (see admin-ui/package.json) before an
      # --ignore, and only ignore what genuinely cannot be moved.
      - name: Audit admin-ui dependencies
        working-directory: admin-ui
        run: bun audit --audit-level=moderate
      # docs/ is a build-time-only VitePress toolchain that ships static HTML,
      # so its transitive dev-server advisories (vite/esbuild) never reach the
      # published product; the Dependabot /docs entry tracks the bumps. Gate
      # this at CRITICAL (not high) so a genuine docs-toolchain emergency still
      # fails CI, without blocking on the dev-only high/moderate advisories.
      - name: Audit docs dependencies
        working-directory: docs
        run: bun audit --audit-level=critical
