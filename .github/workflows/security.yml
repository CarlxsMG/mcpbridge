# Dependency-vulnerability gates: a PR dependency review (blocks pulling in a
# known-vulnerable or badly-licensed dep) plus a lockfile audit on push/PR and
# weekly (so a newly-disclosed CVE in an already-pinned dep still surfaces).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # Mondays 04:41 UTC

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Only meaningful on a PR (it diffs the PR's dependency changes).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # No `bun install` runs in this job (`bun audit` reads the committed
      # lockfiles directly), so there's deliberately no ~/.bun/install/cache step
      # here — it would cache a directory nothing populates or consumes.
      #
      # Gate at MODERATE, with every accepted advisory named individually via
      # --ignore. The previous blanket --audit-level=high swallowed the entire
      # moderate tier to tolerate exactly two known findings, which also meant a
      # NEW moderate advisory in a runtime dependency (express, ws, the MCP SDK)
      # would never have failed this job. Naming them instead makes each one an
      # explicit decision with an exit condition; anything not listed below is a
      # build failure at moderate or above.
      #
      # There are no --ignore flags right now, and the last ones are worth
      # remembering. Three qs advisories were ignored for the dev-only copy
      # nested under @stryker-mutator/core -> typed-rest-client (an EXACT
      # "6.15.1" pin). An ignore matches by advisory id alone, so it also hid
      # those advisories for the RUNTIME qs copy under express — the one it was
      # never meant to excuse. They went once the nested copy was collapsed
      # onto the patched hoisted one by hand-editing bun.lock (see the qs@6
      # entry in dependency-overrides.json). The earlier claim here, that no
      # override could reach that nested copy, was a misreading: bun ignores
      # major-scoped `pkg@N` override keys during resolution altogether
      # (measured 2026-09-15), so the `"qs@6"` key it tested never applied to
      # anything. Prefer a hand-edited lockfile line to an --ignore.
      # GHSA-frvp-7c67-39w9 (path traversal in @hono/node-server's serve-static)
      #   USED to be ignored here, on the stated grounds that the fix landed in
      #   >=2.0.5 and the MCP SDK's `^1.19.9` range could not reach it. That was
      #   wrong: the fix was backported to the 1.x line in 1.19.15, well inside
      #   the SDK's existing range. The tree sat on 1.19.14 only because a
      #   resolved lockfile entry never moves on its own. Bumping it to 1.19.17
      #   fixes the advisory outright, so the ignore is gone rather than
      #   inherited — no override key is needed, since a fresh resolve of
      #   `^1.19.9` now picks a patched version by itself.
      - name: Audit root dependencies
        run: bun audit --audit-level=moderate
      # No ignores here either: admin-ui audits clean at moderate. Keep it that
      # way — reach for a hand-edited bun.lock line plus its documented
      # `overrides` entry (CLAUDE.md) before an --ignore, and only ignore what
      # genuinely cannot be moved.
      - name: Audit admin-ui dependencies
        working-directory: admin-ui
        run: bun audit --audit-level=moderate
      # docs/ is a build-time-only VitePress toolchain that ships static HTML,
      # so its transitive dev-server advisories (vite/esbuild) never reach the
      # published product; the Dependabot /docs entry tracks the bumps. Gate
      # this at CRITICAL (not high) so a genuine docs-toolchain emergency still
      # fails CI, without blocking on the dev-only high/moderate advisories.
      - name: Audit docs dependencies
        working-directory: docs
        run: bun audit --audit-level=critical
