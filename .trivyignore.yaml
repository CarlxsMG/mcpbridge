# Trivy vulnerability ignore policy (YAML format — the plain `.trivyignore` list
# has no expiry support, this does). Consumed by docker-publish.yml's image-scan
# gate via its `trivyignores:` input. Every entry MUST carry a `statement` (why
# it's safe to defer) and an `expired_at` (when it must be re-evaluated) — after
# that date Trivy stops honouring the entry and the finding re-blocks the release,
# so nothing is suppressed silently forever.
#
# Empty on purpose. The last entry, GHSA-frvp-7c67-39w9 (@hono/node-server), was
# justified as "fixed only in 2.0.5, a major the MCP SDK's range can't reach".
# Both halves turned out false: the fix was backported to the 1.x line in
# 1.19.15, and the tree already resolves 1.19.17, so the entry was suppressing
# nothing. Check an advisory's patched range on EVERY affected line before
# adding an entry on the grounds that the fix needs a major.

vulnerabilities: []
